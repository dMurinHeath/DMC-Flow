name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quality gate
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync content-hashed static assets
        env:
          BUCKET: ${{ vars.AWS_S3_BUCKET }}
        run: |
          aws s3 sync ./out/_next/static "s3://${BUCKET}/_next/static" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Sync HTML and non-hashed assets
        env:
          BUCKET: ${{ vars.AWS_S3_BUCKET }}
        run: |
          aws s3 sync ./out "s3://${BUCKET}" \
            --delete \
            --cache-control "public,max-age=0,must-revalidate" \
            --exclude "_next/static/*"

      - name: Invalidate CloudFront
        env:
          DISTRIBUTION_ID: ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${DISTRIBUTION_ID}" \
            --paths "/*"
